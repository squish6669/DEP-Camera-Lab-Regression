name: Camera Lab Production Bridge Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/camera-lab-production-bridge.yml"
      - "scripts/run_camera_lab_bridge.py"
      - "scripts/production_inference.py"
      - "scripts/score_production_inference.py"
      - "scripts/model_target_crop.py"
      - "scripts/model_postprocess.py"
      - "scripts/serial_postprocess.py"
      - "scripts/capacity_postprocess.py"
      - "scripts/capacity_multiview_images.py"
      - "scripts/label_region_views.py"
      - "data/**"
      - "*Part*.zip"
      - "Camera%20Roll%20-%20Part%*.zip"

permissions:
  contents: read

env:
  RAPID_REPO: squish6669/RapidOCRCSharp
  RAPID_REF: ede58cc34fc07be55a049861c8e77edd9ca0e1a8
  TARGET_CORPUS_COUNT: "123"
  SERIAL_NO_REGRESSION_MIN_PCT: "95.0"
  MODEL_BASELINE_MIN_PCT: "100.0"
  CAPACITY_BASELINE_MIN_PCT: "100.0"

jobs:
  validate-production-bridge:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout regression repository
        uses: actions/checkout@v4

      - name: Expand exact 123-image unified corpus
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path regression-images | Out-Null
          $parts = @(Get-ChildItem -File -Filter "*.zip" | Where-Object { $_.Name -match 'Part(?:%20|\s)*[123]\.zip$' } | Sort-Object Name)
          if ($parts.Count -ne 3) { throw "Expected exactly three split corpus archives; found $($parts.Count)" }
          foreach ($part in $parts) { Expand-Archive -LiteralPath $part.FullName -DestinationPath regression-images -Force }
          $images = @(Get-ChildItem regression-images -Recurse -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($images.Count -ne [int]$env:TARGET_CORPUS_COUNT) { throw "Unified corpus must contain exactly 123 images; found $($images.Count)" }
          $gt = @(Import-Csv data/Camera-Lab-Ground-Truth.csv)
          $verified = @($gt | Where-Object { ([string]$_.Verified).Trim().ToUpperInvariant() -eq 'YES' }).Count
          if ($verified -ne 68) { throw "Verified scoring subset changed unexpectedly: $verified" }
          $unverified = $images.Count - $verified
          if ($unverified -ne 55) { throw "Processed-but-unverified count changed unexpectedly: $unverified" }
          $dirs = @($images | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          if ($dirs.Count -ne 1) { throw "Expected unified corpus in one image directory" }
          "IMAGE_DIR=$($dirs[0])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "Production bridge corpus: 123/123; verified: 68; unscored: 55" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Checkout pinned RapidOCR source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RAPID_REPO }}
          ref: ${{ env.RAPID_REF }}
          path: RapidOCRCSharp

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish actual CameraLabRapidOcr bridge
        shell: pwsh
        run: |
          $actual = (git -C RapidOCRCSharp rev-parse HEAD).Trim()
          if ($actual -ne $env:RAPID_REF) { throw "RapidOCR revision mismatch" }
          dotnet publish RapidOCRCSharp/CameraLabRapidOcr/CameraLabRapidOcr.csproj -c Release -r win-x64 --self-contained true -o camera-lab-bridge
          if ($LASTEXITCODE -ne 0) { throw "CameraLabRapidOcr publish failed" }
          New-Item -ItemType Directory -Force -Path camera-lab-bridge/models | Out-Null
          Copy-Item RapidOCRCSharp/RapidOCRConsole/models/* camera-lab-bridge/models -Recurse -Force
          if (!(Test-Path camera-lab-bridge/CameraLabRapidOcr.exe)) { throw "Published CameraLabRapidOcr.exe missing" }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run actual production bridge on all 123 images
        shell: pwsh
        run: |
          python scripts/run_camera_lab_bridge.py --exe "$pwd\camera-lab-bridge\CameraLabRapidOcr.exe" --images "$env:IMAGE_DIR" --out-dir bridge-full --max-side-len 2048
          if ($LASTEXITCODE -ne 0) { throw "Production bridge OCR failed" }
          $rows = @(Import-Csv bridge-full/RapidOCR_Images.csv)
          if ($rows.Count -ne 123) { throw "Production bridge coverage failed: $($rows.Count)/123" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "Production bridge reported $($errors.Count) image errors" }

      - name: Build targeted model crops from production bridge detections
        shell: pwsh
        run: |
          python -m pip install pillow
          python scripts/model_target_crop.py --images "$env:IMAGE_DIR" --detections bridge-full/RapidOCR_Detections.csv --out-dir targeted-model-crops
          if ($LASTEXITCODE -ne 0) { throw "Targeted crop generation failed" }
          $crops = @(Get-ChildItem targeted-model-crops -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($crops.Count -eq 0) { throw "Targeted crop generation produced no crops" }

      - name: Run production bridge on targeted model crops
        shell: pwsh
        run: |
          python scripts/run_camera_lab_bridge.py --exe "$pwd\camera-lab-bridge\CameraLabRapidOcr.exe" --images targeted-model-crops --out-dir bridge-targeted --max-side-len 2048
          if ($LASTEXITCODE -ne 0) { throw "Targeted production bridge OCR failed" }

      - name: Build deterministic capacity alternate views
        shell: pwsh
        run: |
          python scripts/capacity_multiview_images.py --images "$env:IMAGE_DIR" --out-dir capacity-multiview --expected-count 123
          if ($LASTEXITCODE -ne 0) { throw "Capacity multiview generation failed" }
          $views = @(Get-ChildItem capacity-multiview -File -Filter "*.jpg")
          if ($views.Count -ne 246) { throw "Expected exactly 246 deterministic capacity views; found $($views.Count)" }

      - name: Run production bridge on capacity alternate views
        shell: pwsh
        run: |
          python scripts/run_camera_lab_bridge.py --exe "$pwd\camera-lab-bridge\CameraLabRapidOcr.exe" --images capacity-multiview --out-dir bridge-capacity-alt --max-side-len 2048
          if ($LASTEXITCODE -ne 0) { throw "Capacity alternate-view production bridge OCR failed" }
          $rows = @(Import-Csv bridge-capacity-alt/RapidOCR_Images.csv)
          if ($rows.Count -ne 246) { throw "Capacity alternate-view bridge coverage failed: $($rows.Count)/246" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "Capacity alternate-view bridge reported $($errors.Count) image errors" }

      - name: Build deterministic OCR-only label-region views
        shell: pwsh
        run: |
          python scripts/label_region_views.py --images "$env:IMAGE_DIR" --detections bridge-full/RapidOCR_Detections.csv --out-dir label-region-views --expected-count 123
          if ($LASTEXITCODE -ne 0) { throw "Label-region view generation failed" }
          $views = @(Get-ChildItem label-region-views -File -Filter "*__label.jpg")
          if ($views.Count -ne 123) { throw "Expected exactly 123 label-region views; found $($views.Count)" }

      - name: Build deterministic 180-degree label views
        shell: pwsh
        run: |
          @'
          import csv
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageOps

          src = Path('label-region-views')
          out = Path('rotated-label-views')
          out.mkdir(exist_ok=True)
          with open(src/'Label-Region-Map.csv', encoding='utf-8-sig') as f:
              mapping=list(csv.DictReader(f))
          if len(mapping) != 123:
              raise SystemExit(f'Expected 123 label map rows; found {len(mapping)}')
          rows=[]
          for r in mapping:
              source=r['SourceFile']
              im=Image.open(src/r['ViewFile']).convert('L')
              im=ImageOps.autocontrast(im, cutoff=1)
              im=im.rotate(180, expand=False)
              im=im.resize((im.width*2, im.height*2), Image.Resampling.LANCZOS)
              im=im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=180, threshold=2))
              name=Path(source).stem+'__label_rot180.jpg'
              im.save(out/name, quality=95, subsampling=0)
              rows.append({'SourceImage':source,'ViewImage':name,'Method':'label-rot180-autocontrast-unsharp'})
          if len(rows) != 123 or len({r['SourceImage'] for r in rows}) != 123:
              raise SystemExit('Rotated label mapping coverage invariant failed')
          with open(out/'Rotated-Label-Map.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['SourceImage','ViewImage','Method'])
              w.writeheader(); w.writerows(rows)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Rotated label view generation failed" }
          $views = @(Get-ChildItem rotated-label-views -File -Filter "*.jpg")
          if ($views.Count -ne 123) { throw "Expected exactly 123 rotated label views; found $($views.Count)" }

      - name: Run production bridge on rotated label views at 3072
        shell: pwsh
        run: |
          python scripts/run_camera_lab_bridge.py --exe "$pwd\camera-lab-bridge\CameraLabRapidOcr.exe" --images rotated-label-views --out-dir bridge-rotated-label --max-side-len 3072
          if ($LASTEXITCODE -ne 0) { throw "Rotated-label production bridge OCR failed" }
          $rows = @(Import-Csv bridge-rotated-label/RapidOCR_Images.csv)
          if ($rows.Count -ne 123) { throw "Rotated-label bridge coverage failed: $($rows.Count)/123" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "Rotated-label bridge reported $($errors.Count) image errors" }

      - name: Run ground-truth-free production inference
        shell: pwsh
        run: |
          python scripts/production_inference.py --detections bridge-full/RapidOCR_Detections.csv --images bridge-full/RapidOCR_Images.csv --targeted-detections bridge-targeted/RapidOCR_Detections.csv --capacity-view-map capacity-multiview/Capacity-Multiview-Map.csv --capacity-alternate-detections bridge-capacity-alt/RapidOCR_Detections.csv --rotated-label-view-map rotated-label-views/Rotated-Label-Map.csv --rotated-label-detections bridge-rotated-label/RapidOCR_Detections.csv --out-dir production-results
          if ($LASTEXITCODE -ne 0) { throw "Production inference failed" }
          $s = Get-Content production-results/Camera-Lab-Production-Inference-Summary.json -Raw | ConvertFrom-Json
          if ([bool]$s.ground_truth_consumed) { throw "Production inference consumed ground truth" }
          if ([int]$s.images -ne 123) { throw "Production inference image count changed" }

      - name: Validate production bridge outputs only after inference
        shell: pwsh
        run: |
          python scripts/score_production_inference.py --ground-truth data/Camera-Lab-Ground-Truth.csv --inference production-results/Camera-Lab-Production-Inference.csv --out-dir validation-results --serial-min-pct $env:SERIAL_NO_REGRESSION_MIN_PCT --model-min-exact 66 --capacity-min-exact 68
          if ($LASTEXITCODE -ne 0) { throw "Production bridge validation scorer failed" }
          $v = Get-Content validation-results/Production-Inference-Validation.json -Raw | ConvertFrom-Json
          if ([double]$v.serial_pct -lt [double]$env:SERIAL_NO_REGRESSION_MIN_PCT) { throw "Production serial safety gate regressed: $($v.serial_pct)%" }
          if ([double]$v.model_pct -lt [double]$env:MODEL_BASELINE_MIN_PCT) { throw "Production model baseline regressed: $($v.model_pct)%" }
          if ([double]$v.capacity_pct -lt [double]$env:CAPACITY_BASELINE_MIN_PCT) { throw "Production capacity baseline regressed: $($v.capacity_pct)%" }
          Get-Content validation-results/Production-Inference-Validation.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload production bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Lab-Production-Bridge-${{ github.run_number }}
          path: |
            production-results/**
            validation-results/**
            bridge-full/RapidOCR_Images.csv
            bridge-full/RapidOCR_Detections.csv
            bridge-targeted/RapidOCR_Images.csv
            bridge-targeted/RapidOCR_Detections.csv
            bridge-capacity-alt/RapidOCR_Images.csv
            bridge-capacity-alt/RapidOCR_Detections.csv
            capacity-multiview/Capacity-Multiview-Map.csv
            bridge-rotated-label/RapidOCR_Images.csv
            bridge-rotated-label/RapidOCR_Detections.csv
            rotated-label-views/Rotated-Label-Map.csv
          if-no-files-found: warn
          retention-days: 30
