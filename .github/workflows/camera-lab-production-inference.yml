name: Camera Lab 123-Image Production Inference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/camera-lab-production-inference.yml"
      - "scripts/production_inference.py"
      - "scripts/validate_inference_contract.py"
      - "scripts/score_production_inference.py"
      - "scripts/serial_postprocess.py"
      - "scripts/model_postprocess.py"
      - "scripts/model_target_crop.py"
      - "scripts/capacity_postprocess.py"
      - "scripts/capacity_multiview_images.py"
      - "scripts/label_region_views.py"
      - "docs/Camera-Lab-Inference-Contract-v1.md"
      - "data/**"
      - "*Part*.zip"
      - "Camera%20Roll%20-%20Part%*.zip"

permissions:
  contents: read

env:
  RAPID_REPO: squish6669/RapidOCRCSharp
  RAPID_REF: ede58cc34fc07be55a049861c8e77edd9ca0e1a8
  TARGET_CORPUS_COUNT: "123"
  SERIAL_NO_REGRESSION_MIN_PCT: "95.0"

jobs:
  production-inference:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout regression repository
        uses: actions/checkout@v4

      - name: Expand exact 123-image unified corpus
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path regression-images | Out-Null
          $parts = @(Get-ChildItem -File -Filter "*.zip" | Where-Object { $_.Name -match 'Part(?:%20|\s)*[123]\.zip$' } | Sort-Object Name)
          if ($parts.Count -ne 3) { throw "Expected exactly three split corpus archives; found $($parts.Count)" }
          foreach ($part in $parts) { Expand-Archive -LiteralPath $part.FullName -DestinationPath regression-images -Force }
          $images = @(Get-ChildItem regression-images -Recurse -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($images.Count -ne [int]$env:TARGET_CORPUS_COUNT) { throw "Unified corpus must contain exactly 123 images; found $($images.Count)" }
          $names = @($images | ForEach-Object { $_.Name.ToLowerInvariant() })
          if (@($names | Sort-Object -Unique).Count -ne $images.Count) { throw "Duplicate image filenames in unified corpus" }
          $dirs = @($images | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          if ($dirs.Count -ne 1) { throw "Expected unified corpus in one image directory" }
          $gt = @(Import-Csv data/Camera-Lab-Ground-Truth.csv)
          $verified = @($gt | Where-Object { ([string]$_.Verified).Trim().ToUpperInvariant() -eq 'YES' }).Count
          if ($verified -ne 68) { throw "Verified scoring subset changed unexpectedly: $verified" }
          $unverified = $images.Count - $verified
          if ($unverified -ne 55) { throw "Processed-but-unverified count changed unexpectedly: $unverified" }
          "IMAGE_DIR=$($dirs[0])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "Physical corpus: 123/123; verified scoring rows: 68; unscored: 55" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Checkout pinned RapidOCR source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RAPID_REPO }}
          ref: ${{ env.RAPID_REF }}
          path: RapidOCRCSharp

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish pinned OCR runner
        shell: pwsh
        run: |
          $actual = (git -C RapidOCRCSharp rev-parse HEAD).Trim()
          if ($actual -ne $env:RAPID_REF) { throw "RapidOCR revision mismatch" }
          dotnet publish RapidOCRCSharp/DriveLabelSweep/DriveLabelSweep.csproj -c Release -r win-x64 --self-contained true -o sweep-publish
          New-Item -ItemType Directory -Force -Path sweep-publish/models | Out-Null
          Copy-Item RapidOCRCSharp/RapidOCRConsole/models/* sweep-publish/models -Recurse -Force

      - name: OCR all 123 images at 2048
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "$env:IMAGE_DIR" "2048"
          if ($LASTEXITCODE -ne 0) { throw "OCR sweep failed" }
          $sweep = Get-ChildItem "$env:IMAGE_DIR" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$sweep) { throw "OCR output folder missing" }
          $result = Join-Path $sweep.FullName "maxSideLen_2048"
          $rows = @(Import-Csv (Join-Path $result "RapidOCR_Images.csv"))
          if ($rows.Count -ne 123) { throw "OCR coverage failed: $($rows.Count)/123" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "OCR reported $($errors.Count) image errors" }
          "RESULT_DIR=$result" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build targeted model crops
        shell: pwsh
        run: |
          python -m pip install pillow
          python scripts/model_target_crop.py --images "$env:IMAGE_DIR" --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" --out-dir targeted-model-crops
          if ($LASTEXITCODE -ne 0) { throw "Targeted crop generation failed" }

      - name: OCR targeted model crops at 2048
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "targeted-model-crops" "2048"
          if ($LASTEXITCODE -ne 0) { throw "Targeted OCR sweep failed" }
          $sweep = Get-ChildItem "targeted-model-crops" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$sweep) { throw "Targeted OCR output folder missing" }
          $result = Join-Path $sweep.FullName "maxSideLen_2048"
          "TARGET_RESULT_DIR=$result" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build deterministic capacity alternate views
        shell: pwsh
        run: |
          python scripts/capacity_multiview_images.py --images "$env:IMAGE_DIR" --out-dir capacity-multiview --expected-count 123
          if ($LASTEXITCODE -ne 0) { throw "Capacity multiview generation failed" }
          $views = @(Get-ChildItem capacity-multiview -File -Filter "*.jpg")
          if ($views.Count -ne 246) { throw "Expected exactly 246 deterministic capacity views; found $($views.Count)" }

      - name: OCR capacity alternate views at 2048
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "capacity-multiview" "2048"
          if ($LASTEXITCODE -ne 0) { throw "Capacity alternate-view OCR sweep failed" }
          $sweep = Get-ChildItem "capacity-multiview" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$sweep) { throw "Capacity alternate-view OCR output folder missing" }
          $result = Join-Path $sweep.FullName "maxSideLen_2048"
          $rows = @(Import-Csv (Join-Path $result "RapidOCR_Images.csv"))
          if ($rows.Count -ne 246) { throw "Capacity alternate-view OCR coverage failed: $($rows.Count)/246" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "Capacity alternate-view OCR reported $($errors.Count) errors" }
          "CAPACITY_ALT_RESULT_DIR=$result" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build deterministic OCR-only label-region views
        shell: pwsh
        run: |
          python scripts/label_region_views.py --images "$env:IMAGE_DIR" --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" --out-dir label-region-views --expected-count 123
          if ($LASTEXITCODE -ne 0) { throw "Label-region view generation failed" }
          $views = @(Get-ChildItem label-region-views -File -Filter "*__label.jpg")
          if ($views.Count -ne 123) { throw "Expected exactly 123 label-region views; found $($views.Count)" }

      - name: Build deterministic 180-degree label views
        shell: pwsh
        run: |
          @'
          import csv
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageOps

          src = Path('label-region-views')
          out = Path('rotated-label-views')
          out.mkdir(exist_ok=True)
          with open(src/'Label-Region-Map.csv', encoding='utf-8-sig') as f:
              mapping=list(csv.DictReader(f))
          if len(mapping) != 123:
              raise SystemExit(f'Expected 123 label map rows; found {len(mapping)}')
          rows=[]
          for r in mapping:
              source=r['SourceFile']
              im=Image.open(src/r['ViewFile']).convert('L')
              im=ImageOps.autocontrast(im, cutoff=1)
              im=im.rotate(180, expand=False)
              im=im.resize((im.width*2, im.height*2), Image.Resampling.LANCZOS)
              im=im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=180, threshold=2))
              name=Path(source).stem+'__label_rot180.jpg'
              im.save(out/name, quality=95, subsampling=0)
              rows.append({'SourceImage':source,'ViewImage':name,'Method':'label-rot180-autocontrast-unsharp'})
          if len(rows) != 123 or len({r['SourceImage'] for r in rows}) != 123:
              raise SystemExit('Rotated label mapping coverage invariant failed')
          with open(out/'Rotated-Label-Map.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['SourceImage','ViewImage','Method'])
              w.writeheader(); w.writerows(rows)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Rotated label view generation failed" }
          $views = @(Get-ChildItem rotated-label-views -File -Filter "*.jpg")
          if ($views.Count -ne 123) { throw "Expected exactly 123 rotated label views; found $($views.Count)" }

      - name: OCR rotated label views at 3072
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "rotated-label-views" "3072"
          if ($LASTEXITCODE -ne 0) { throw "Rotated label OCR sweep failed" }
          $sweep = Get-ChildItem "rotated-label-views" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$sweep) { throw "Rotated label OCR output folder missing" }
          $result = Join-Path $sweep.FullName "maxSideLen_3072"
          $rows = @(Import-Csv (Join-Path $result "RapidOCR_Images.csv"))
          if ($rows.Count -ne 123) { throw "Rotated label OCR coverage failed: $($rows.Count)/123" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "Rotated label OCR reported $($errors.Count) errors" }
          "ROTATED_LABEL_RESULT_DIR=$result" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run production inference without ground truth
        shell: pwsh
        run: |
          python scripts/production_inference.py --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" --images "$env:RESULT_DIR\RapidOCR_Images.csv" --targeted-detections "$env:TARGET_RESULT_DIR\RapidOCR_Detections.csv" --capacity-view-map "capacity-multiview\Capacity-Multiview-Map.csv" --capacity-alternate-detections "$env:CAPACITY_ALT_RESULT_DIR\RapidOCR_Detections.csv" --rotated-label-view-map "rotated-label-views\Rotated-Label-Map.csv" --rotated-label-detections "$env:ROTATED_LABEL_RESULT_DIR\RapidOCR_Detections.csv" --out-dir production-results
          if ($LASTEXITCODE -ne 0) { throw "Production inference failed" }
          $s = Get-Content production-results/Camera-Lab-Production-Inference-Summary.json -Raw | ConvertFrom-Json
          if ([int]$s.images -ne 123) { throw "Production inference coverage failed: $($s.images)/123" }
          if ([bool]$s.ground_truth_consumed) { throw "Production inference must never consume ground truth" }
          "Ground-truth-free multiview capacity fills: $($s.capacity_multiview_fills)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Ground-truth-free rotated-label anchored capacity fills: $($s.rotated_label_capacity_fills)" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Enforce production inference contract v1
        shell: pwsh
        run: |
          python scripts/validate_inference_contract.py --inference production-results/Camera-Lab-Production-Inference.csv --summary production-results/Camera-Lab-Production-Inference-Summary.json --expected-images 123 --out-dir contract-results
          if ($LASTEXITCODE -ne 0) { throw "Production inference contract validation failed" }
          $c = Get-Content contract-results/Camera-Lab-Inference-Contract-Validation.json -Raw | ConvertFrom-Json
          "Inference contract: v$($c.contract_version) $($c.status); rows=$($c.rows); ground truth consumed=$($c.ground_truth_consumed)" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Validate production outputs on verified subset
        shell: pwsh
        run: |
          python scripts/score_production_inference.py --ground-truth data/Camera-Lab-Ground-Truth.csv --inference production-results/Camera-Lab-Production-Inference.csv --out-dir validation-results --serial-min-pct $env:SERIAL_NO_REGRESSION_MIN_PCT --model-min-exact 64 --capacity-min-exact 66
          if ($LASTEXITCODE -ne 0) { throw "Production inference safety validation failed" }
          Get-Content validation-results/Production-Inference-Validation.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Collect OCR diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostic-results\full | Out-Null
          New-Item -ItemType Directory -Force -Path diagnostic-results\targeted-model | Out-Null
          New-Item -ItemType Directory -Force -Path diagnostic-results\capacity-multiview | Out-Null
          New-Item -ItemType Directory -Force -Path diagnostic-results\rotated-label | Out-Null
          if ($env:RESULT_DIR -and (Test-Path $env:RESULT_DIR)) {
            Copy-Item "$env:RESULT_DIR\RapidOCR_Images.csv" diagnostic-results\full\ -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:RESULT_DIR\RapidOCR_Detections.csv" diagnostic-results\full\ -Force -ErrorAction SilentlyContinue
          }
          if ($env:TARGET_RESULT_DIR -and (Test-Path $env:TARGET_RESULT_DIR)) {
            Copy-Item "$env:TARGET_RESULT_DIR\RapidOCR_Images.csv" diagnostic-results\targeted-model\ -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:TARGET_RESULT_DIR\RapidOCR_Detections.csv" diagnostic-results\targeted-model\ -Force -ErrorAction SilentlyContinue
          }
          if ($env:CAPACITY_ALT_RESULT_DIR -and (Test-Path $env:CAPACITY_ALT_RESULT_DIR)) {
            Copy-Item "$env:CAPACITY_ALT_RESULT_DIR\RapidOCR_Images.csv" diagnostic-results\capacity-multiview\ -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:CAPACITY_ALT_RESULT_DIR\RapidOCR_Detections.csv" diagnostic-results\capacity-multiview\ -Force -ErrorAction SilentlyContinue
          }
          if ($env:ROTATED_LABEL_RESULT_DIR -and (Test-Path $env:ROTATED_LABEL_RESULT_DIR)) {
            Copy-Item "$env:ROTATED_LABEL_RESULT_DIR\RapidOCR_Images.csv" diagnostic-results\rotated-label\ -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:ROTATED_LABEL_RESULT_DIR\RapidOCR_Detections.csv" diagnostic-results\rotated-label\ -Force -ErrorAction SilentlyContinue
          }
          Copy-Item capacity-multiview\Capacity-Multiview-Map.csv diagnostic-results\capacity-multiview\ -Force -ErrorAction SilentlyContinue
          Copy-Item rotated-label-views\Rotated-Label-Map.csv diagnostic-results\rotated-label\ -Force -ErrorAction SilentlyContinue

      - name: Upload production inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Lab-123-Production-Inference-${{ github.run_number }}
          path: |
            production-results/**
            contract-results/**
            validation-results/**
            diagnostic-results/**
          if-no-files-found: warn
          retention-days: 30
