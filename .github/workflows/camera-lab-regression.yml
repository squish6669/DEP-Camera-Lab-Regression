name: Camera Lab Unified Corpus Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Camera Roll.zip"
      - "scripts/**"
      - "data/**"
      - "regression-thresholds.json"
      - ".github/workflows/camera-lab-regression.yml"
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

env:
  RAPID_REPO: squish6669/RapidOCRCSharp
  TARGET_CORPUS_COUNT: "123"

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout regression repository
        uses: actions/checkout@v4

      - name: Inventory unified corpus
        shell: pwsh
        run: |
          if (!(Test-Path "Camera Roll.zip")) { throw "Camera Roll.zip is missing" }
          if (!(Test-Path "data/Camera-Lab-Ground-Truth.csv")) { throw "Ground-truth CSV is missing" }

          New-Item -ItemType Directory -Force -Path regression-images | Out-Null
          Expand-Archive -Path "Camera Roll.zip" -DestinationPath regression-images -Force

          $images = @(Get-ChildItem regression-images -Recurse -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          $groundTruth = @(Import-Csv "data/Camera-Lab-Ground-Truth.csv")

          if ($images.Count -ne $groundTruth.Count) {
            throw "Corpus mismatch: $($images.Count) live images but $($groundTruth.Count) ground-truth rows. Every available image must have one matching ground-truth row."
          }

          $imageDirs = @($images | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          if ($imageDirs.Count -ne 1) {
            throw "Expected the available corpus in one folder, found $($imageDirs.Count) folders"
          }

          $imageNames = @($images | ForEach-Object { $_.Name.ToLowerInvariant() } | Sort-Object)
          $gtNames = @($groundTruth | ForEach-Object { ([string]$_.Image).Trim().ToLowerInvariant() } | Where-Object { $_ } | Sort-Object)
          if ($gtNames.Count -ne $groundTruth.Count) {
            throw "Ground truth contains one or more blank Image values"
          }
          if (@($imageNames | Sort-Object -Unique).Count -ne $imageNames.Count) {
            throw "Available corpus contains duplicate image filenames"
          }
          if (@($gtNames | Sort-Object -Unique).Count -ne $gtNames.Count) {
            throw "Ground truth contains duplicate Image values"
          }

          $missingGt = @(Compare-Object -ReferenceObject $imageNames -DifferenceObject $gtNames | Where-Object SideIndicator -eq '<=' | ForEach-Object InputObject)
          $missingImage = @(Compare-Object -ReferenceObject $imageNames -DifferenceObject $gtNames | Where-Object SideIndicator -eq '=>' | ForEach-Object InputObject)
          if ($missingGt.Count -gt 0 -or $missingImage.Count -gt 0) {
            Write-Host "Images without ground truth: $($missingGt -join ', ')"
            Write-Host "Ground-truth rows without images: $($missingImage -join ', ')"
            throw "Available image/ground-truth filenames do not match"
          }

          $current = $images.Count
          $target = [int]$env:TARGET_CORPUS_COUNT
          $remaining = [Math]::Max(0, $target - $current)
          $complete = ($current -eq $target)

          if ($current -gt $target) {
            throw "Corpus contains $current images, which exceeds configured target $target. Increase TARGET_CORPUS_COUNT so the corpus remains one growing set."
          }

          $imageDir = $imageDirs[0]
          "IMAGE_DIR=$imageDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CORPUS_COUNT=$current" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CORPUS_REMAINING=$remaining" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CORPUS_COMPLETE=$($complete.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Camera Lab unified corpus inventory: $current/$target live images; $remaining source images still need to be incorporated."
          if (!$complete) {
            Write-Warning "Full 123-image corpus is not yet physically present. Regression will continue on all currently available images so development is not blocked, but this run is NOT release-complete."
          }

          "# Camera Lab Unified Corpus" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Live images available: **$current / $target**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Source images remaining: **$remaining**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Full-corpus release complete: **$complete**" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Checkout RapidOCR source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RAPID_REPO }}
          path: RapidOCRCSharp

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish benchmark runner
        shell: pwsh
        run: |
          dotnet publish RapidOCRCSharp/DriveLabelBenchmark/DriveLabelBenchmark.csproj -c Release -r win-x64 --self-contained true -o benchmark-publish
          New-Item -ItemType Directory -Force -Path benchmark-publish/models | Out-Null
          Copy-Item RapidOCRCSharp/RapidOCRConsole/models/* benchmark-publish/models -Recurse -Force

      - name: Run RapidOCR on available unified corpus
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & .\benchmark-publish\DriveLabelBenchmark.exe "$env:IMAGE_DIR"
          $exit = $LASTEXITCODE
          $sw.Stop()
          if ($exit -ne 0) { throw "Benchmark exited with code $exit" }
          $result = Get-ChildItem "$env:IMAGE_DIR" -Directory -Filter "RapidOCR_Benchmark_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$result) { throw "Benchmark output folder not found" }
          "RESULT_DIR=$($result.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OCR_ELAPSED_SECONDS=$([math]::Round($sw.Elapsed.TotalSeconds,2))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "RapidOCR elapsed: $([math]::Round($sw.Elapsed.TotalSeconds,2)) seconds for $env:CORPUS_COUNT images"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python imaging dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow

      - name: Score serial and model regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path regression-results | Out-Null
          python scripts/regression_score.py `
            --ground-truth data/Camera-Lab-Ground-Truth.csv `
            --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" `
            --images "$env:RESULT_DIR\RapidOCR_Images.csv" `
            --out-dir regression-results `
            --thresholds regression-thresholds.json
          $exit = $LASTEXITCODE
          if (Test-Path regression-results/Regression-Summary.md) {
            "## Recognition regression ($env:CORPUS_COUNT images currently available)" | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content regression-results/Regression-Summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          if ($exit -ne 0) { exit $exit }

      - name: Create targeted model crops
        shell: pwsh
        run: |
          python scripts/model_target_crop.py `
            --images "$env:IMAGE_DIR" `
            --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" `
            --out-dir targeted-model-crops
          if ($LASTEXITCODE -ne 0) { throw "Targeted crop generation failed" }
          $crops = @(Get-ChildItem targeted-model-crops -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($crops.Count -lt 1) { throw "No targeted model crops were created" }
          Write-Host "Targeted model crops: $($crops.Count)"

      - name: Reread targeted model regions
        shell: pwsh
        run: |
          & .\benchmark-publish\DriveLabelBenchmark.exe "targeted-model-crops"
          $exit = $LASTEXITCODE
          if ($exit -ne 0) { throw "Targeted model reread exited with code $exit" }
          $target = Get-ChildItem "targeted-model-crops" -Directory -Filter "RapidOCR_Benchmark_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$target) { throw "Targeted model reread output folder not found" }
          "TARGET_RESULT_DIR=$($target.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Score corrected serial extraction
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path regression-results/serial | Out-Null
          python scripts/serial_postprocess.py `
            --ground-truth data/Camera-Lab-Ground-Truth.csv `
            --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" `
            --images "$env:RESULT_DIR\RapidOCR_Images.csv" `
            --out-dir regression-results/serial
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path regression-results/serial/Serial-Postprocess-Summary.md) {
            Get-Content regression-results/serial/Serial-Postprocess-Summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Score corrected model extraction
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path regression-results/model | Out-Null
          python scripts/model_postprocess.py `
            --ground-truth data/Camera-Lab-Ground-Truth.csv `
            --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" `
            --targeted-detections "$env:TARGET_RESULT_DIR\RapidOCR_Detections.csv" `
            --out-dir regression-results/model
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path regression-results/model/Model-Postprocess-Summary.md) {
            Get-Content regression-results/model/Model-Postprocess-Summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Score capacity extraction
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path regression-results | Out-Null
          python scripts/capacity_postprocess.py `
            --ground-truth data/Camera-Lab-Ground-Truth.csv `
            --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" `
            --out-dir regression-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path regression-results/Capacity-Postprocess-Summary.md) {
            Get-Content regression-results/Capacity-Postprocess-Summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Enforce promotion gate
        if: success()
        shell: pwsh
        run: |
          if (!(Test-Path regression-results/Regression-Summary.json)) { throw "Regression summary is missing" }
          if (!(Test-Path regression-results/serial/Serial-Postprocess-Summary.json)) { throw "Serial summary is missing" }
          if (!(Test-Path regression-results/model/Model-Postprocess-Summary.json)) { throw "Model summary is missing" }
          if (!(Test-Path regression-results/Capacity-Postprocess-Summary.json)) { throw "Capacity summary is missing" }

          $thresholds = Get-Content regression-thresholds.json | ConvertFrom-Json
          $release = $thresholds.release_minimums
          $baseline = (Get-Content regression-results/Regression-Summary.json | ConvertFrom-Json).metrics
          $serial = Get-Content regression-results/serial/Serial-Postprocess-Summary.json | ConvertFrom-Json
          $model = Get-Content regression-results/model/Model-Postprocess-Summary.json | ConvertFrom-Json
          $capacity = Get-Content regression-results/Capacity-Postprocess-Summary.json | ConvertFrom-Json

          $checks = @(
            @{ Name = 'Corrected serial exact'; Actual = [double]$serial.corrected_pct; Required = [double]$release.serial_corrected_pct },
            @{ Name = 'Selected model exact'; Actual = [double]$model.selected_pct; Required = [double]$release.model_selected_pct },
            @{ Name = 'Capacity exact'; Actual = [double]$capacity.capacity_pct; Required = [double]$release.capacity_pct }
          )

          $failed = @()
          "## Promotion gate" | Add-Content $env:GITHUB_STEP_SUMMARY
          "| Metric | Actual | Required | Status |" | Add-Content $env:GITHUB_STEP_SUMMARY
          "|---|---:|---:|---|" | Add-Content $env:GITHUB_STEP_SUMMARY
          foreach ($check in $checks) {
            $pass = $check.Actual -ge $check.Required
            if (!$pass) { $failed += "$($check.Name)=$($check.Actual)% < $($check.Required)%" }
            $status = if ($pass) { "PASS" } else { "FAIL" }
            "| $($check.Name) | $([math]::Round($check.Actual,1))% | $([math]::Round($check.Required,1))% | $status |" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

          $baselinePass = ([int]$baseline.errors -le [int]$thresholds.maximums.errors)
          $baselineStatus = if ($baselinePass) { "PASS" } else { "FAIL" }
          "| OCR errors | $([int]$baseline.errors) | <= $([int]$thresholds.maximums.errors) | $baselineStatus |" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (!$baselinePass) { $failed += "errors=$([int]$baseline.errors) > $([int]$thresholds.maximums.errors)" }

          "- Corpus completeness: **$env:CORPUS_COUNT / $env:TARGET_CORPUS_COUNT** (full corpus complete: **$env:CORPUS_COMPLETE**)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Evaluation loop: reruns on qualifying pushes, manual dispatch, and the weekly schedule; it does not self-loop within a single run." | Add-Content $env:GITHUB_STEP_SUMMARY

          if ($failed.Count -gt 0) {
            "- Promotion status: **NOT READY**" | Add-Content $env:GITHUB_STEP_SUMMARY
            throw ("Promotion gate failed: " + ($failed -join '; '))
          }

          "- Promotion status: **READY FOR 97% TARGET PROMOTION**" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Report timing and release completeness
        if: always()
        shell: pwsh
        run: |
          $count = [double]$env:CORPUS_COUNT
          $seconds = [double]$env:OCR_ELAPSED_SECONDS
          if ($count -gt 0 -and $seconds -gt 0) {
            $avg = [math]::Round($seconds / $count, 3)
            "## Timing" | Add-Content $env:GITHUB_STEP_SUMMARY
            "- OCR elapsed: **$seconds sec**" | Add-Content $env:GITHUB_STEP_SUMMARY
            "- Images processed: **$env:CORPUS_COUNT**" | Add-Content $env:GITHUB_STEP_SUMMARY
            "- Average OCR time/image: **$avg sec**" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          if ($env:CORPUS_COMPLETE -ne 'true') {
            "- Release status: **NOT FULL-CORPUS COMPLETE** — $env:CORPUS_REMAINING source images still need to be incorporated." | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "- Release status: **FULL CORPUS COMPLETE**" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Lab-Unified-Regression-${{ github.run_number }}
          path: |
            regression-results/**
            targeted-model-crops/Targeted-Crops.csv
            ${{ env.RESULT_DIR }}/RapidOCR_Images.csv
            ${{ env.RESULT_DIR }}/RapidOCR_Detections.csv
            ${{ env.RESULT_DIR }}/RapidOCR_Results.json
            ${{ env.TARGET_RESULT_DIR }}/RapidOCR_Images.csv
            ${{ env.TARGET_RESULT_DIR }}/RapidOCR_Detections.csv
            ${{ env.TARGET_RESULT_DIR }}/RapidOCR_Results.json
          if-no-files-found: warn
          retention-days: 30
