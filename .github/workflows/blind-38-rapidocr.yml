name: Camera Lab 38-Image Blind RapidOCR
on:
  workflow_dispatch:
  push:
    branches: [unseen-batch-20260908]
    paths: [".github/workflows/blind-38-rapidocr.yml"]
permissions:
  contents: read
env:
  RAPID_REPO: squish6669/RapidOCRCSharp
jobs:
  blind-ocr:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen 38-image corpus
        shell: pwsh
        run: |
          $zip = "unseen/batch 38.zip"
          if (!(Test-Path $zip)) { throw "$zip is missing" }
          New-Item -ItemType Directory -Force blind38-images | Out-Null
          Expand-Archive $zip blind38-images -Force
          $images = @(Get-ChildItem blind38-images -Recurse -File | ? Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$')
          if ($images.Count -ne 38) { throw "Expected 38 images, found $($images.Count)" }
          $dirs = @($images | % DirectoryName | Sort-Object -Unique)
          if ($dirs.Count -ne 1) { throw "Expected one image folder, found $($dirs.Count)" }
          "IMAGE_DIR=$($dirs[0])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CORPUS_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RAPID_REPO }}
          path: RapidOCRCSharp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish benchmark runner
        shell: pwsh
        run: |
          dotnet publish RapidOCRCSharp/DriveLabelBenchmark/DriveLabelBenchmark.csproj -c Release -r win-x64 --self-contained true -o benchmark-publish
          New-Item -ItemType Directory -Force benchmark-publish/models | Out-Null
          Copy-Item RapidOCRCSharp/RapidOCRConsole/models/* benchmark-publish/models -Recurse -Force
      - name: Run frozen first pass
        shell: pwsh
        run: |
          & .\benchmark-publish\DriveLabelBenchmark.exe "$env:IMAGE_DIR"
          if ($LASTEXITCODE -ne 0) { throw "Benchmark failed: $LASTEXITCODE" }
          $r = Get-ChildItem "$env:IMAGE_DIR" -Directory -Filter "RapidOCR_Benchmark_*" | Sort LastWriteTime -Descending | Select -First 1
          if (!$r) { throw "Benchmark output missing" }
          "RESULT_DIR=$($r.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "# Blind 38 first pass" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Corpus SHA256: $env:CORPUS_SHA256" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Ground truth was not supplied to OCR." | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Lab-Blind38-FirstPass-${{ github.run_number }}
          path: |
            ${{ env.RESULT_DIR }}/RapidOCR_Images.csv
            ${{ env.RESULT_DIR }}/RapidOCR_Detections.csv
            ${{ env.RESULT_DIR }}/RapidOCR_Results.json
          if-no-files-found: warn
          retention-days: 90
