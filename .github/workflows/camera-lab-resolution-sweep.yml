# Regression sweep: full-label OCR plus targeted model-region reread
name: Camera Lab OCR Resolution Sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/camera-lab-resolution-sweep.yml"
      - "scripts/**"
      - "data/**"
      - "Camera Roll.zip"

permissions:
  contents: read

env:
  RAPID_REPO: squish6669/RapidOCRCSharp

jobs:
  sweep:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout private regression repository
        uses: actions/checkout@v4

      - name: Verify 68-image private corpus
        shell: pwsh
        run: |
          if (!(Test-Path "Camera Roll.zip")) { throw "Camera Roll.zip is missing" }
          New-Item -ItemType Directory -Force -Path regression-images | Out-Null
          Expand-Archive -Path "Camera Roll.zip" -DestinationPath regression-images -Force
          $images = @(Get-ChildItem regression-images -Recurse -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($images.Count -ne 68) { throw "Expected 68 images, found $($images.Count)" }
          $imageDirs = @($images | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          if ($imageDirs.Count -ne 1) { throw "Expected all 68 images in one folder, found $($imageDirs.Count) folders" }
          $imageDir = $imageDirs[0]
          "IMAGE_DIR=$imageDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout RapidOCR source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RAPID_REPO }}
          path: RapidOCRCSharp

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish resolution sweep runner
        shell: pwsh
        run: |
          dotnet publish RapidOCRCSharp/DriveLabelSweep/DriveLabelSweep.csproj -c Release -r win-x64 --self-contained true -o sweep-publish
          New-Item -ItemType Directory -Force -Path sweep-publish/models | Out-Null
          Copy-Item RapidOCRCSharp/RapidOCRConsole/models/* sweep-publish/models -Recurse -Force

      - name: Run 1024 vs 1600 vs 2048 full-label sweep
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "$env:IMAGE_DIR" "1024,1600,2048"
          if ($LASTEXITCODE -ne 0) { throw "Sweep exited with code $LASTEXITCODE" }
          $result = Get-ChildItem "$env:IMAGE_DIR" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$result) { throw "Sweep output directory not found" }
          "SWEEP_DIR=$($result.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build targeted model crops from 2048 detections
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/model_target_crop.py --images "$env:IMAGE_DIR" --detections "$env:SWEEP_DIR\maxSideLen_2048\RapidOCR_Detections.csv" --out-dir targeted-model-crops
          if ($LASTEXITCODE -ne 0) { throw "Targeted crop generation failed" }
          $crops = @(Get-ChildItem targeted-model-crops -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($crops.Count -lt 1) { throw "No targeted model crops were created" }
          Write-Host "Targeted model crops: $($crops.Count)"

      - name: Reread targeted model regions at 2048
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "targeted-model-crops" "2048"
          if ($LASTEXITCODE -ne 0) { throw "Targeted model reread exited with code $LASTEXITCODE" }
          $result = Get-ChildItem "targeted-model-crops" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$result) { throw "Targeted model reread output not found" }
          "TARGET_SWEEP_DIR=$($result.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Score each resolution
        shell: pwsh
        run: |
          foreach ($len in 1024,1600,2048) {
            $setting = "$env:SWEEP_DIR\maxSideLen_$len"
            $out = "resolution-results\$len"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            python scripts/regression_score.py --ground-truth data/Camera-Lab-Ground-Truth.csv --detections "$setting\RapidOCR_Detections.csv" --images "$setting\RapidOCR_Images.csv" --out-dir $out
            if ($LASTEXITCODE -ne 0) { throw "Scoring failed for maxSideLen=$len" }

            $post = "resolution-results\$len-postprocess"
            New-Item -ItemType Directory -Force -Path $post | Out-Null
            python scripts/serial_postprocess.py --ground-truth data/Camera-Lab-Ground-Truth.csv --detections "$setting\RapidOCR_Detections.csv" --images "$setting\RapidOCR_Images.csv" --out-dir $post
            if ($LASTEXITCODE -ne 0) { throw "Serial postprocess failed for maxSideLen=$len" }

            $model = "resolution-results\$len-model"
            New-Item -ItemType Directory -Force -Path $model | Out-Null
            if ($len -eq 2048) {
              python scripts/model_postprocess.py --ground-truth data/Camera-Lab-Ground-Truth.csv --detections "$setting\RapidOCR_Detections.csv" --targeted-detections "$env:TARGET_SWEEP_DIR\maxSideLen_2048\RapidOCR_Detections.csv" --out-dir $model
            } else {
              python scripts/model_postprocess.py --ground-truth data/Camera-Lab-Ground-Truth.csv --detections "$setting\RapidOCR_Detections.csv" --out-dir $model
            }
            if ($LASTEXITCODE -ne 0) { throw "Model postprocess failed for maxSideLen=$len" }
          }

      - name: Enforce 2048 serial production baseline
        shell: pwsh
        run: |
          $s = Get-Content resolution-results/2048-postprocess/Serial-Postprocess-Summary.json | ConvertFrom-Json
          Write-Host "2048 corrected serial exact: $($s.corrected_exact)/$($s.serial_n)"
          if ([int]$s.corrected_exact -lt 60) { throw "Serial regression: production baseline requires at least 60/63 exact (95%)" }

      - name: Build comparison report and choose winner
        shell: pwsh
        run: |
          @'
          import csv, json
          from pathlib import Path
          root=Path('resolution-results'); rows=[]
          for n in [1024,1600,2048]:
              base=json.loads((root/str(n)/'Regression-Summary.json').read_text(encoding='utf-8'))['metrics']
              serial=json.loads((root/f'{n}-postprocess'/'Serial-Postprocess-Summary.json').read_text(encoding='utf-8'))
              model=json.loads((root/f'{n}-model'/'Model-Postprocess-Summary.json').read_text(encoding='utf-8'))
              rows.append({'MaxSideLen':n,'RawSerialExact':base['raw_serial_exact'],'CorrectedSerialExact':serial['corrected_exact'],'CorrectedSerialExactPct':serial['corrected_pct'],'RawModelExact':base['raw_model_exact'],'CorrectedModelExact':model['selected_exact'],'CorrectedModelExactPct':model['selected_pct'],'AverageMs':base['avg_ms'],'P95Ms':base['p95_ms'],'Errors':base['errors']})
          winner=max(rows,key=lambda r:(r['CorrectedSerialExact'],r['CorrectedModelExact'],-r['AverageMs']))
          with open(root/'Resolution-Comparison.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rows[0].keys());w.writeheader();w.writerows(rows)
          md=['# Camera Lab OCR Resolution Sweep','', '| Max side | Corrected serial | Corrected model | Raw model | Avg ms | P95 ms | Errors |','|---:|---:|---:|---:|---:|---:|---:|']
          for r in rows: md.append(f"| {r['MaxSideLen']} | {r['CorrectedSerialExact']}/63 ({r['CorrectedSerialExactPct']}%) | {r['CorrectedModelExact']}/66 ({r['CorrectedModelExactPct']}%) | {r['RawModelExact']}/66 | {r['AverageMs']} | {r['P95Ms']} | {r['Errors']} |")
          md += ['',f"## Winner: **maxSideLen {winner['MaxSideLen']}**",'', '## 2048 remaining serial misses','']
          sm=(root/'2048-postprocess'/'Serial-Postprocess-Summary.md').read_text(encoding='utf-8').split('## Remaining misses',1)
          if len(sm)==2: md.append('## Remaining misses'+sm[1])
          md += ['', '## 2048 remaining model misses','']
          mm=(root/'2048-model'/'Model-Postprocess-Summary.md').read_text(encoding='utf-8').split('## Remaining misses',1)
          if len(mm)==2: md.append('## Remaining misses'+mm[1])
          (root/'Resolution-Comparison.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print('\n'.join(md))
          '@ | Set-Content compare_resolutions.py -Encoding UTF8
          python compare_resolutions.py
          Get-Content resolution-results/Resolution-Comparison.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Lab-Resolution-Sweep-${{ github.run_number }}
          path: |
            resolution-results/**
            targeted-model-crops/Targeted-Crops.csv
            ${{ env:TARGET_SWEEP_DIR }}/SweepResults.csv
            ${{ env:TARGET_SWEEP_DIR }}/maxSideLen_2048/RapidOCR_Images.csv
            ${{ env:TARGET_SWEEP_DIR }}/maxSideLen_2048/RapidOCR_Detections.csv
            ${{ env.SWEEP_DIR }}/SweepResults.csv
            ${{ env.SWEEP_DIR }}/SweepSummary.csv
            ${{ env.SWEEP_DIR }}/maxSideLen_1024/RapidOCR_Images.csv
            ${{ env.SWEEP_DIR }}/maxSideLen_1024/RapidOCR_Detections.csv
            ${{ env.SWEEP_DIR }}/maxSideLen_1600/RapidOCR_Images.csv
            ${{ env.SWEEP_DIR }}/maxSideLen_1600/RapidOCR_Detections.csv
            ${{ env.SWEEP_DIR }}/maxSideLen_2048/RapidOCR_Images.csv
            ${{ env.SWEEP_DIR }}/maxSideLen_2048/RapidOCR_Detections.csv
          if-no-files-found: warn
          retention-days: 30
