name: Camera Lab 123-Image Capacity Multiview Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/camera-lab-capacity-multiview.yml"
      - "scripts/capacity_multiview_images.py"
      - "scripts/capacity_multiview_eval.py"
      - "scripts/capacity_postprocess.py"
      - "scripts/serial_postprocess.py"
      - "data/**"
      - "*Part*.zip"
      - "Camera%20Roll%20-%20Part%*.zip"

permissions:
  contents: read

env:
  RAPID_REPO: squish6669/RapidOCRCSharp
  RAPID_REF: ede58cc34fc07be55a049861c8e77edd9ca0e1a8
  TARGET_CORPUS_COUNT: "123"
  VERIFIED_SCORING_COUNT: "68"
  UNVERIFIED_PROCESSING_COUNT: "55"
  SERIAL_NO_REGRESSION_MIN_PCT: "95.0"
  CAPACITY_NO_REGRESSION_MIN_PCT: "97.1"

jobs:
  capacity-multiview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Expand and lock exact unified corpus
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path regression-images | Out-Null
          $parts = @(Get-ChildItem -File -Filter "*.zip" | Where-Object { $_.Name -match 'Part(?:%20|\s)*[123]\.zip$' } | Sort-Object Name)
          if ($parts.Count -ne 3) { throw "Expected exactly three split corpus archives; found $($parts.Count)" }
          foreach ($part in $parts) { Expand-Archive -LiteralPath $part.FullName -DestinationPath regression-images -Force }
          $images = @(Get-ChildItem regression-images -Recurse -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($images.Count -ne [int]$env:TARGET_CORPUS_COUNT) { throw "Unified corpus must contain exactly 123 physical images; found $($images.Count)" }
          $names = @($images | ForEach-Object { $_.Name.ToLowerInvariant() })
          if (@($names | Sort-Object -Unique).Count -ne $images.Count) { throw "Duplicate physical image filenames in unified corpus" }
          $dirs = @($images | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          if ($dirs.Count -ne 1) { throw "Expected unified corpus in one physical image directory" }
          $gt = @(Import-Csv data/Camera-Lab-Ground-Truth.csv)
          $verified = @($gt | Where-Object { ([string]$_.Verified).Trim().ToUpperInvariant() -eq 'YES' }).Count
          if ($verified -ne [int]$env:VERIFIED_SCORING_COUNT) { throw "Verified scoring subset changed unexpectedly: $verified" }
          $unverified = $images.Count - $verified
          if ($unverified -ne [int]$env:UNVERIFIED_PROCESSING_COUNT) { throw "Processed-but-unverified count changed unexpectedly: $unverified" }
          "IMAGE_DIR=$($dirs[0])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout pinned RapidOCR source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RAPID_REPO }}
          ref: ${{ env.RAPID_REF }}
          path: RapidOCRCSharp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish pinned OCR runner
        shell: pwsh
        run: |
          $actual = (git -C RapidOCRCSharp rev-parse HEAD).Trim()
          if ($actual -ne $env:RAPID_REF) { throw "RapidOCR revision mismatch" }
          dotnet publish RapidOCRCSharp/DriveLabelSweep/DriveLabelSweep.csproj -c Release -r win-x64 --self-contained true -o sweep-publish
          New-Item -ItemType Directory -Force -Path sweep-publish/models | Out-Null
          Copy-Item RapidOCRCSharp/RapidOCRConsole/models/* sweep-publish/models -Recurse -Force

      - name: OCR all 123 physical images
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "$env:IMAGE_DIR" "2048"
          if ($LASTEXITCODE -ne 0) { throw "Physical-image OCR sweep failed" }
          $sweep = Get-ChildItem "$env:IMAGE_DIR" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$sweep) { throw "OCR output folder missing" }
          $result = Join-Path $sweep.FullName "maxSideLen_2048"
          $rows = @(Import-Csv (Join-Path $result "RapidOCR_Images.csv"))
          if ($rows.Count -ne 123) { throw "OCR coverage failed: $($rows.Count)/123" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "OCR reported $($errors.Count) physical-image errors" }
          "RESULT_DIR=$result" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconfirm protected serial baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path serial-results | Out-Null
          python scripts/serial_postprocess.py --ground-truth data/Camera-Lab-Ground-Truth.csv --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" --images "$env:RESULT_DIR\RapidOCR_Images.csv" --out-dir serial-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $s = Get-Content serial-results/Serial-Postprocess-Summary.json -Raw | ConvertFrom-Json
          if ([double]$s.corrected_pct -lt [double]$env:SERIAL_NO_REGRESSION_MIN_PCT) { throw "Serial safety gate regressed: $($s.corrected_exact)/$($s.serial_n) = $($s.corrected_pct)%" }

      - name: Establish capacity baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path capacity-baseline | Out-Null
          python scripts/capacity_postprocess.py --ground-truth data/Camera-Lab-Ground-Truth.csv --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" --out-dir capacity-baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $c = Get-Content capacity-baseline/Capacity-Postprocess-Summary.json -Raw | ConvertFrom-Json
          if ([double]$c.capacity_pct -lt [double]$env:CAPACITY_NO_REGRESSION_MIN_PCT) { throw "Existing capacity baseline regressed before multiview test: $($c.capacity_exact)/$($c.capacity_n) = $($c.capacity_pct)%" }

      - name: Build deterministic alternate views
        shell: pwsh
        run: |
          python -m pip install pillow
          python scripts/capacity_multiview_images.py --images "$env:IMAGE_DIR" --out-dir capacity-multiview --expected-count 123
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $views = @(Get-ChildItem capacity-multiview -File -Filter "*.jpg")
          if ($views.Count -ne 246) { throw "Expected exactly 246 derived OCR views from 123 physical images; found $($views.Count)" }

      - name: OCR alternate views
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "capacity-multiview" "2048"
          if ($LASTEXITCODE -ne 0) { throw "Alternate-view OCR sweep failed" }
          $sweep = Get-ChildItem "capacity-multiview" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$sweep) { throw "Alternate-view OCR output folder missing" }
          $result = Join-Path $sweep.FullName "maxSideLen_2048"
          $rows = @(Import-Csv (Join-Path $result "RapidOCR_Images.csv"))
          if ($rows.Count -ne 246) { throw "Alternate-view OCR coverage failed: $($rows.Count)/246" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "Alternate-view OCR reported $($errors.Count) errors" }
          "ALT_RESULT_DIR=$result" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Evaluate empty-result-only capacity recovery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path capacity-multiview-results | Out-Null
          python scripts/capacity_multiview_eval.py --ground-truth data/Camera-Lab-Ground-Truth.csv --baseline-results capacity-baseline/Capacity-Postprocess-Results.csv --view-map capacity-multiview/Capacity-Multiview-Map.csv --alternate-detections "$env:ALT_RESULT_DIR\RapidOCR_Detections.csv" --out-dir capacity-multiview-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $c = Get-Content capacity-multiview-results/Capacity-Multiview-Summary.json -Raw | ConvertFrom-Json
          if ([int]$c.physical_images -ne 123) { throw "Physical corpus contract failed: $($c.physical_images)" }
          if ([int]$c.capacity_n -ne 68) { throw "Verified capacity scoring subset changed: $($c.capacity_n)" }
          if ([double]$c.capacity_pct -lt [double]$env:CAPACITY_NO_REGRESSION_MIN_PCT) { throw "Multiview capacity regressed: $($c.capacity_exact)/$($c.capacity_n) = $($c.capacity_pct)%" }
          Get-Content capacity-multiview-results/Capacity-Multiview-Summary.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Stage multiview evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path multiview-evidence | Out-Null
          Copy-Item capacity-multiview/Capacity-Multiview-Map.csv multiview-evidence -Force -ErrorAction SilentlyContinue
          if ($env:ALT_RESULT_DIR -and (Test-Path $env:ALT_RESULT_DIR)) {
            Copy-Item "$env:ALT_RESULT_DIR\RapidOCR_Images.csv" multiview-evidence -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:ALT_RESULT_DIR\RapidOCR_Detections.csv" multiview-evidence -Force -ErrorAction SilentlyContinue
          }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Lab-123-Capacity-Multiview-${{ github.run_number }}
          path: |
            serial-results/**
            capacity-baseline/**
            capacity-multiview-results/**
            multiview-evidence/**
          if-no-files-found: warn
          retention-days: 30
