name: Camera Lab 123-Image Enhanced Label Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/camera-lab-enhanced-label-evidence.yml"
      - "scripts/label_region_views.py"
      - "*Part*.zip"
      - "Camera%20Roll%20-%20Part%*.zip"

permissions:
  contents: read

env:
  RAPID_REPO: squish6669/RapidOCRCSharp
  RAPID_REF: ede58cc34fc07be55a049861c8e77edd9ca0e1a8
  TARGET_CORPUS_COUNT: "123"

jobs:
  enhanced-label-evidence:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout regression repository
        uses: actions/checkout@v4

      - name: Expand exact 123-image unified corpus
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path regression-images | Out-Null
          $parts = @(Get-ChildItem -File -Filter "*.zip" | Where-Object { $_.Name -match 'Part(?:%20|\s)*[123]\.zip$' } | Sort-Object Name)
          if ($parts.Count -ne 3) { throw "Expected exactly three split corpus archives; found $($parts.Count)" }
          foreach ($part in $parts) { Expand-Archive -LiteralPath $part.FullName -DestinationPath regression-images -Force }
          $images = @(Get-ChildItem regression-images -Recurse -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($images.Count -ne [int]$env:TARGET_CORPUS_COUNT) { throw "Unified corpus must contain exactly 123 images; found $($images.Count)" }
          $names = @($images | ForEach-Object { $_.Name.ToLowerInvariant() })
          if (@($names | Sort-Object -Unique).Count -ne $images.Count) { throw "Duplicate image filenames in unified corpus" }
          $dirs = @($images | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique)
          if ($dirs.Count -ne 1) { throw "Expected unified corpus in one image directory" }
          "IMAGE_DIR=$($dirs[0])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout pinned RapidOCR source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RAPID_REPO }}
          ref: ${{ env.RAPID_REF }}
          path: RapidOCRCSharp

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish pinned OCR runner
        shell: pwsh
        run: |
          $actual = (git -C RapidOCRCSharp rev-parse HEAD).Trim()
          if ($actual -ne $env:RAPID_REF) { throw "RapidOCR revision mismatch" }
          dotnet publish RapidOCRCSharp/DriveLabelSweep/DriveLabelSweep.csproj -c Release -r win-x64 --self-contained true -o sweep-publish
          New-Item -ItemType Directory -Force -Path sweep-publish/models | Out-Null
          Copy-Item RapidOCRCSharp/RapidOCRConsole/models/* sweep-publish/models -Recurse -Force

      - name: OCR all 123 physical images for geometry
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "$env:IMAGE_DIR" "2048"
          if ($LASTEXITCODE -ne 0) { throw "Baseline OCR sweep failed" }
          $sweep = Get-ChildItem "$env:IMAGE_DIR" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$sweep) { throw "Baseline OCR output folder missing" }
          $result = Join-Path $sweep.FullName "maxSideLen_2048"
          $rows = @(Import-Csv (Join-Path $result "RapidOCR_Images.csv"))
          if ($rows.Count -ne 123) { throw "Baseline OCR coverage failed: $($rows.Count)/123" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "Baseline OCR reported $($errors.Count) image errors" }
          "BASE_RESULT_DIR=$result" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deterministic OCR-only label-region views
        shell: pwsh
        run: |
          python -m pip install pillow
          python scripts/label_region_views.py --images "$env:IMAGE_DIR" --detections "$env:BASE_RESULT_DIR\RapidOCR_Detections.csv" --out-dir label-region-views --expected-count 123
          if ($LASTEXITCODE -ne 0) { throw "Label-region view generation failed" }
          $views = @(Get-ChildItem label-region-views -File -Filter "*__label.jpg")
          if ($views.Count -ne 123) { throw "Expected exactly 123 label-region views; found $($views.Count)" }

      - name: Build two deterministic enhanced label views per physical image
        shell: pwsh
        run: |
          @'
          import csv
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter, ImageOps

          src = Path('label-region-views')
          out = Path('enhanced-label-views')
          out.mkdir(exist_ok=True)
          rows=[]
          sources=[]
          with open(src/'Label-Region-Map.csv', encoding='utf-8-sig') as f:
              mapping=list(csv.DictReader(f))
          if len(mapping) != 123:
              raise SystemExit(f'Expected 123 label map rows; found {len(mapping)}')
          for r in mapping:
              source=r['SourceFile']
              view=src/r['ViewFile']
              im=Image.open(view).convert('L')
              im=ImageOps.autocontrast(im, cutoff=1)
              im=im.resize((im.width*2, im.height*2), Image.Resampling.LANCZOS)

              a=im.filter(ImageFilter.UnsharpMask(radius=1.2, percent=180, threshold=2))
              a_name=Path(source).stem+'__label_auto_sharp.jpg'
              a.save(out/a_name, quality=95, subsampling=0)
              rows.append({'SourceImage':source,'ViewImage':a_name,'Method':'label-autocontrast-unsharp'})

              b=ImageEnhance.Contrast(im).enhance(1.75)
              b=ImageEnhance.Sharpness(b).enhance(2.0)
              b_name=Path(source).stem+'__label_high_contrast.jpg'
              b.save(out/b_name, quality=95, subsampling=0)
              rows.append({'SourceImage':source,'ViewImage':b_name,'Method':'label-autocontrast-high-contrast'})

          if len(rows) != 246 or len({r['SourceImage'] for r in rows}) != 123:
              raise SystemExit('Enhanced label mapping coverage invariant failed')
          with open(out/'Enhanced-Label-Map.csv','w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['SourceImage','ViewImage','Method'])
              w.writeheader(); w.writerows(rows)
          print('Created 246 deterministic enhanced views for 123 physical images')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Enhanced label view generation failed" }
          $views = @(Get-ChildItem enhanced-label-views -File -Filter "*.jpg")
          if ($views.Count -ne 246) { throw "Expected exactly 246 derived enhanced views; found $($views.Count)" }

      - name: OCR enhanced label views at 3072
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "enhanced-label-views" "3072"
          if ($LASTEXITCODE -ne 0) { throw "Enhanced label OCR sweep failed" }
          $sweep = Get-ChildItem "enhanced-label-views" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$sweep) { throw "Enhanced label OCR output folder missing" }
          $result = Join-Path $sweep.FullName "maxSideLen_3072"
          $rows = @(Import-Csv (Join-Path $result "RapidOCR_Images.csv"))
          if ($rows.Count -ne 246) { throw "Enhanced label OCR coverage failed: $($rows.Count)/246 derived views" }
          $errors = @($rows | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Error) })
          if ($errors.Count -gt 0) { throw "Enhanced label OCR reported $($errors.Count) derived-view errors" }
          "ENHANCED_RESULT_DIR=$result" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify diagnostic isolation
        shell: pwsh
        run: |
          $map = @(Import-Csv enhanced-label-views/Enhanced-Label-Map.csv)
          if ($map.Count -ne 246) { throw "Enhanced label map must contain exactly 246 derived views; found $($map.Count)" }
          $sources = @($map.SourceImage | Sort-Object -Unique)
          if ($sources.Count -ne 123) { throw "Enhanced label map must cover exactly 123 physical source images; found $($sources.Count)" }
          $bad = @($map | Group-Object SourceImage | Where-Object { $_.Count -ne 2 })
          if ($bad.Count -gt 0) { throw "Every physical image must have exactly two enhanced views" }
          "### Enhanced label OCR evidence" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Physical source images: **123**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Verified/scored subset consumed by diagnostic: **0**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Derived enhanced OCR views: **246**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Ground truth consumed by diagnostic: **false**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Production inference modified: **false**" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Collect evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostic-results\enhanced-label | Out-Null
          if ($env:ENHANCED_RESULT_DIR -and (Test-Path $env:ENHANCED_RESULT_DIR)) { Copy-Item "$env:ENHANCED_RESULT_DIR\RapidOCR_*.csv" diagnostic-results\enhanced-label\ -Force -ErrorAction SilentlyContinue }
          Copy-Item enhanced-label-views\Enhanced-Label-Map.csv diagnostic-results\enhanced-label\ -Force -ErrorAction SilentlyContinue

      - name: Upload enhanced label evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Lab-123-Enhanced-Label-Evidence-${{ github.run_number }}
          path: diagnostic-results/**
          if-no-files-found: warn
          retention-days: 14
