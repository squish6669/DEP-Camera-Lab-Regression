name: Camera Lab All Three Serial Regression
on:
  workflow_dispatch:
  push:
    branches: [unseen-batch-20260908]
    paths:
      - ".github/workflows/all-three-serial-regression.yml"
      - "scripts/serial_postprocess.py"
      - "scripts/serial_vendor_enhance.py"
      - "scripts/serial_rescue_v2.py"
      - "scripts/serial_rescue_v3.py"
      - "scripts/serial_fusion.py"
permissions:
  contents: read
env:
  RAPID_REPO: squish6669/RapidOCRCSharp
  RAPID_REF: ede58cc34fc07be55a049861c8e77edd9ca0e1a8
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: original68
            zip: "Camera Roll.zip"
            gt: "data/Camera-Lab-Ground-Truth.csv"
            expected_images: 68
          - batch: unseen17
            zip: "unseen/20260908/Camera Roll (2).zip"
            gt: "unseen/20260908/Unseen-Ground-Truth-20260908.csv"
            expected_images: 17
          - batch: blind38
            zip: "unseen/batch 38.zip"
            gt: "unseen/Blind38-Ground-Truth-Serial.csv"
            expected_images: 38
    steps:
      - uses: actions/checkout@v4

      - name: Expand corpus
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "images-${{ matrix.batch }}" | Out-Null
          Expand-Archive "${{ matrix.zip }}" "images-${{ matrix.batch }}" -Force
          $images = @(Get-ChildItem "images-${{ matrix.batch }}" -Recurse -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($images.Count -ne ${{ matrix.expected_images }}) { throw "${{ matrix.batch }} expected ${{ matrix.expected_images }} images, found $($images.Count)" }
          $dirs = @($images | ForEach-Object DirectoryName | Sort-Object -Unique)
          if ($dirs.Count -ne 1) { throw "${{ matrix.batch }} expected one image directory, found $($dirs.Count)" }
          "IMAGE_DIR=$($dirs[0])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RAPID_REPO }}
          ref: ${{ env.RAPID_REF }}
          path: RapidOCRCSharp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish pinned RapidOCR sweep runner
        shell: pwsh
        run: |
          dotnet publish RapidOCRCSharp/DriveLabelSweep/DriveLabelSweep.csproj -c Release -r win-x64 --self-contained true -o sweep-publish
          New-Item -ItemType Directory -Force sweep-publish/models | Out-Null
          Copy-Item RapidOCRCSharp/RapidOCRConsole/models/* sweep-publish/models -Recurse -Force

      - name: Run RapidOCR dual-resolution evidence
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "$env:IMAGE_DIR" "1024,2048"
          if ($LASTEXITCODE -ne 0) { throw "RapidOCR dual sweep failed $LASTEXITCODE" }
          $r = Get-ChildItem "$env:IMAGE_DIR" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$r) { throw "${{ matrix.batch }} result folder missing" }
          "RESULT_ROOT=$($r.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Score each resolution and fuse evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "score-${{ matrix.batch }}" | Out-Null
          foreach ($res in @(1024,2048)) {
            $rd = "$env:RESULT_ROOT\maxSideLen_$res"
            $root = "score-${{ matrix.batch }}\r$res"
            python scripts/serial_postprocess.py --ground-truth "${{ matrix.gt }}" --detections "$rd\RapidOCR_Detections.csv" --images "$rd\RapidOCR_Images.csv" --out-dir "$root\base-raw"
            if ($LASTEXITCODE -ne 0) { throw "Base $res failed $LASTEXITCODE" }
            python scripts/serial_vendor_enhance.py --ground-truth "${{ matrix.gt }}" --detections "$rd\RapidOCR_Detections.csv" --base-results "$root\base-raw\Serial-Postprocess-Results.csv" --out-dir "$root\base"
            if ($LASTEXITCODE -ne 0) { throw "Vendor enhance $res failed $LASTEXITCODE" }
            python scripts/serial_rescue_v2.py --ground-truth "${{ matrix.gt }}" --detections "$rd\RapidOCR_Detections.csv" --base-results "$root\base\Serial-Postprocess-Results.csv" --out-dir "$root\v2"
            if ($LASTEXITCODE -ne 0) { throw "v2 $res failed $LASTEXITCODE" }
            python scripts/serial_rescue_v3.py --ground-truth "${{ matrix.gt }}" --detections "$rd\RapidOCR_Detections.csv" --v2-results "$root\v2\Serial-Rescue-v2-Results.csv" --out-dir "$root\v3"
            if ($LASTEXITCODE -ne 0) { throw "v3 $res failed $LASTEXITCODE" }
          }
          python scripts/serial_fusion.py --ground-truth "${{ matrix.gt }}" --r1024-base "score-${{ matrix.batch }}\r1024\base\Serial-Postprocess-Results.csv" --r1024-v3 "score-${{ matrix.batch }}\r1024\v3\Serial-Rescue-v3-Results.csv" --r2048-base "score-${{ matrix.batch }}\r2048\base\Serial-Postprocess-Results.csv" --r2048-v3 "score-${{ matrix.batch }}\r2048\v3\Serial-Rescue-v3-Results.csv" --out-dir "score-${{ matrix.batch }}\fusion"
          if ($LASTEXITCODE -ne 0) { throw "Fusion failed $LASTEXITCODE" }
          "## ${{ matrix.batch }} dual-resolution identity evidence" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### 1024 vendor-enhanced" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "score-${{ matrix.batch }}\r1024\base\Serial-Vendor-Enhance-Summary.json" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "score-${{ matrix.batch }}\r1024\v3\Serial-Rescue-v3-Summary.json" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### 2048 vendor-enhanced" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "score-${{ matrix.batch }}\r2048\base\Serial-Vendor-Enhance-Summary.json" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "score-${{ matrix.batch }}\r2048\v3\Serial-Rescue-v3-Summary.json" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### Fused" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "score-${{ matrix.batch }}\fusion\Serial-Fusion-Summary.json" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Enforce serial regression gates
        shell: pwsh
        run: |
          $s = Get-Content "score-${{ matrix.batch }}\fusion\Serial-Fusion-Summary.json" | ConvertFrom-Json
          $min = switch ("${{ matrix.batch }}") { "original68" {60}; "unseen17" {16}; "blind38" {33}; default {0} }
          Write-Host "${{ matrix.batch }} fusion: $($s.final_exact)/$($s.serial_n); required >= $min"
          if ([int]$s.final_exact -lt $min) { throw "Regression gate failed for ${{ matrix.batch }}: $($s.final_exact)/$($s.serial_n), require $min" }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Lab-AllThree-Dual-${{ matrix.batch }}-${{ github.run_number }}
          path: |
            score-${{ matrix.batch }}/**
            ${{ env.RESULT_ROOT }}/SweepSummary.csv
            ${{ env.RESULT_ROOT }}/maxSideLen_1024/RapidOCR_Images.csv
            ${{ env.RESULT_ROOT }}/maxSideLen_1024/RapidOCR_Detections.csv
            ${{ env.RESULT_ROOT }}/maxSideLen_2048/RapidOCR_Images.csv
            ${{ env.RESULT_ROOT }}/maxSideLen_2048/RapidOCR_Detections.csv
          if-no-files-found: warn
          retention-days: 90
