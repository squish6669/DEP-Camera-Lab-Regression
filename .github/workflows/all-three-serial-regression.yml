name: Camera Lab All Three Serial Regression
on:
  workflow_dispatch:
  push:
    branches: [unseen-batch-20260908]
    paths:
      - ".github/workflows/all-three-serial-regression.yml"
      - "scripts/serial_postprocess.py"
      - "scripts/serial_rescue_v2.py"
      - "scripts/serial_rescue_v3.py"
      - "scripts/serial_rescue_v4.py"
permissions:
  contents: read
env:
  RAPID_REPO: squish6669/RapidOCRCSharp
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: original68
            zip: "Camera Roll.zip"
            gt: "data/Camera-Lab-Ground-Truth.csv"
            expected_images: 68
          - batch: unseen17
            zip: "unseen/20260908/Camera Roll (2).zip"
            gt: "unseen/20260908/Unseen-Ground-Truth-20260908.csv"
            expected_images: 17
          - batch: blind38
            zip: "unseen/batch 38.zip"
            gt: "unseen/Blind38-Ground-Truth-Serial.csv"
            expected_images: 38
    steps:
      - uses: actions/checkout@v4

      - name: Expand corpus
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "images-${{ matrix.batch }}" | Out-Null
          Expand-Archive "${{ matrix.zip }}" "images-${{ matrix.batch }}" -Force
          $images = @(Get-ChildItem "images-${{ matrix.batch }}" -Recurse -File | Where-Object { $_.Extension -match '^\.(jpg|jpeg|png|bmp|tif|tiff)$' })
          if ($images.Count -ne ${{ matrix.expected_images }}) { throw "${{ matrix.batch }} expected ${{ matrix.expected_images }} images, found $($images.Count)" }
          $dirs = @($images | ForEach-Object DirectoryName | Sort-Object -Unique)
          if ($dirs.Count -ne 1) { throw "${{ matrix.batch }} expected one image directory, found $($dirs.Count)" }
          "IMAGE_DIR=$($dirs[0])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RAPID_REPO }}
          path: RapidOCRCSharp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish RapidOCR 2048 sweep runner
        shell: pwsh
        run: |
          dotnet publish RapidOCRCSharp/DriveLabelSweep/DriveLabelSweep.csproj -c Release -r win-x64 --self-contained true -o sweep-publish
          New-Item -ItemType Directory -Force sweep-publish/models | Out-Null
          Copy-Item RapidOCRCSharp/RapidOCRConsole/models/* sweep-publish/models -Recurse -Force

      - name: Run RapidOCR at proven 2048 resolution
        shell: pwsh
        run: |
          & .\sweep-publish\DriveLabelSweep.exe "$env:IMAGE_DIR" "2048"
          if ($LASTEXITCODE -ne 0) { throw "RapidOCR 2048 failed $LASTEXITCODE" }
          $r = Get-ChildItem "$env:IMAGE_DIR" -Directory -Filter "RapidOCR_Sweep_*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$r) { throw "${{ matrix.batch }} 2048 result folder missing" }
          $setting = Join-Path $r.FullName "maxSideLen_2048"
          if (!(Test-Path "$setting\RapidOCR_Detections.csv")) { throw "${{ matrix.batch }} 2048 detections missing" }
          "RESULT_DIR=$setting" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Score current serial intelligence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "score-${{ matrix.batch }}" | Out-Null
          python scripts/serial_postprocess.py --ground-truth "${{ matrix.gt }}" --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" --images "$env:RESULT_DIR\RapidOCR_Images.csv" --out-dir "score-${{ matrix.batch }}\base"
          if ($LASTEXITCODE -ne 0) { throw "Base scorer failed $LASTEXITCODE" }
          python scripts/serial_rescue_v2.py --ground-truth "${{ matrix.gt }}" --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" --base-results "score-${{ matrix.batch }}\base\Serial-Postprocess-Results.csv" --out-dir "score-${{ matrix.batch }}\v2"
          if ($LASTEXITCODE -ne 0) { throw "Rescue v2 failed $LASTEXITCODE" }
          python scripts/serial_rescue_v3.py --ground-truth "${{ matrix.gt }}" --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" --v2-results "score-${{ matrix.batch }}\v2\Serial-Rescue-v2-Results.csv" --out-dir "score-${{ matrix.batch }}\v3"
          if ($LASTEXITCODE -ne 0) { throw "Rescue v3 failed $LASTEXITCODE" }
          python scripts/serial_rescue_v4.py --ground-truth "${{ matrix.gt }}" --detections "$env:RESULT_DIR\RapidOCR_Detections.csv" --v3-results "score-${{ matrix.batch }}\v3\Serial-Rescue-v3-Results.csv" --out-dir "score-${{ matrix.batch }}\v4"
          if ($LASTEXITCODE -ne 0) { throw "Rescue v4 failed $LASTEXITCODE" }
          "## ${{ matrix.batch }} — 2048" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### Proven base" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "score-${{ matrix.batch }}\base\Serial-Postprocess-Summary.json" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### v3" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "score-${{ matrix.batch }}\v3\Serial-Rescue-v3-Summary.json" | Add-Content $env:GITHUB_STEP_SUMMARY
          "### v4" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content "score-${{ matrix.batch }}\v4\Serial-Rescue-v4-Summary.json" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Enforce original production floor
        if: matrix.batch == 'original68'
        shell: pwsh
        run: |
          $s = Get-Content "score-original68\base\Serial-Postprocess-Summary.json" | ConvertFrom-Json
          Write-Host "Original 68 proven 2048 baseline: $($s.corrected_exact)/$($s.serial_n)"
          if ([int]$s.corrected_exact -lt 60) { throw "Regression: original 68 proven 2048 baseline fell below 60/63" }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Lab-AllThree-2048-${{ matrix.batch }}-${{ github.run_number }}
          path: |
            score-${{ matrix.batch }}/**
            ${{ env.RESULT_DIR }}/RapidOCR_Images.csv
            ${{ env.RESULT_DIR }}/RapidOCR_Detections.csv
          if-no-files-found: warn
          retention-days: 90
